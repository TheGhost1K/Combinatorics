  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: >-
    Точное число вида <code>(a + b·√d) / c</code>, где a, b, c, d — целые, c &gt; 0, d &gt; 0.

    Используется для формул Бине в точной арифметике.
  remarks: >-
    <p>

    Хранится в нормализованной форме: <code>gcd(a, b, c) = 1</code>, <code>c &gt; 0</code>.

    </p>

    <p>

    Поддерживает сложение, вычитание, умножение, деление, возведение в степень

    и сопряжение. Все операции возвращают нормализованный результат.

    </p>

    <p>

    Структура неизменяемая (<code>readonly struct</code>) — все операции возвращают новый экземпляр.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var phi = new QuadraticSurd(1, 1, 2, 5);          // (1 + √5)/2

    var phi2 = QuadraticSurd.Pow(phi, 2);             // (3 + √5)/2

    var product = phi * phi.Conjugate;                // -1</code></pre>
  syntax:
    content: 'public readonly struct QuadraticSurd : IEquatable<QuadraticSurd>'
    content.vb: Public Structure QuadraticSurd Implements IEquatable(Of QuadraticSurd)
