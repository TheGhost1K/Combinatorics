  summary: Создаёт число <code>(a + b·√d) / c</code> и приводит его к нормализованной форме.
  remarks: >-
    <p>

    Если <code class="paramref">c</code> отрицательный, все три числа (a, b, c) меняют знак.

    </p>

    <p>

    Затем все три числа делятся на их НОД, чтобы получить несократимую форму.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var x = new QuadraticSurd(2, 2, 4, 5);   // нормализуется к (1 + √5)/2

    var y = new QuadraticSurd(1, 1, -2, 5);  // нормализуется к (-1 - √5)/2</code></pre>
