  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: Возвращает десятичное представление с заданной точностью (для отладки/логов).
  remarks: Округление — вниз (отбрасывание), не по правилам. Для точных значений используйте <xref href="Combinatorics.BigRational.ToString" data-throw-if-not-resolved="false"></xref>.
  example:
  - >-
    <pre><code class="lang-csharp">new BigRational(3, 2).ToDecimalString(6);   // "1.500000"

    new BigRational(1, 3).ToDecimalString(6);   // "0.333333"

    new BigRational(-1, 2).ToDecimalString(2);  // "-0.50"</code></pre>
  syntax:
    content: public string ToDecimalString(int digits = 6)
    parameters:
    - id: digits
      type: System.Int32
      description: Число знаков после запятой, ≥ 0.
    return:
      type: System.String
      description: Строка вида <code>"1.500000"</code> или <code>"-0.333333"</code>.
