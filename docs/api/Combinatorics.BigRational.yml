  source:
    id: BigRational
    path: C:\Users\User\Documents\Repos\Combinatorics\src\BigRational.cs
    startLine: 27
  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: >-
    Несократимая рациональная дробь на основе <xref href="System.Numerics.BigInteger" data-throw-if-not-resolved="false"></xref>.

    Поддерживает арифметику (+, −, ×, ÷), сравнение (==, !=, &lt;, &gt;, &lt;=, &gt;=)

    и неявные преобразования из <xref href="System.Int64" data-throw-if-not-resolved="false"></xref> и <xref href="System.Numerics.BigInteger" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    Дробь всегда хранится в нормализованной форме:

    знаменатель положительный, числитель и знаменатель взаимно просты.

    </p>

    <p>

    Структура неизменяемая (<code>readonly struct</code>) — все операции возвращают новый экземпляр.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var half = new BigRational(1, 2);

    var third = new BigRational(1, 3);

    var sum = half + third;       // 5/6

    var cmp = half &gt; third;      // true

    var b = Combinatorics.Combinatorics.Bernoulli(6); // 1/42</code></pre>
  syntax:
    content: 'public readonly struct BigRational : IEquatable<BigRational>, IComparable<BigRational>, IComparable'
    content.vb: Public Structure BigRational Implements IEquatable(Of BigRational), IComparable(Of BigRational), IComparable
