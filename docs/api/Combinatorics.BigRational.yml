  type: Constructor
  source:
    id: .ctor
    path: C:\Users\User\Documents\Repos\Combinatorics\src\BigRational.cs
    startLine: 69
  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: Создаёт дробь <code class="paramref">num</code>/<code class="paramref">den</code> и приводит её к несократимому виду.
  remarks: >-
    <p>

    Если знаменатель отрицательный, знак переносится в числитель:

    <code>new BigRational(1, -2)</code> даёт <code>-1/2</code>.

    </p>

    <p>

    Дробь сокращается делением на НОД числителя и знаменателя:

    <code>new BigRational(4, 8)</code> даёт <code>1/2</code>.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var r1 = new BigRational(4, 8);    // 1/2

    var r2 = new BigRational(1, -2);   // -1/2

    var r3 = new BigRational(0, 5);    // 0/1</code></pre>
  syntax:
    content: public BigRational(BigInteger num, BigInteger den)
    parameters:
    - id: num
      type: System.Numerics.BigInteger
      description: Числитель. Может быть любым целым.
    - id: den
      type: System.Numerics.BigInteger
      description: Знаменатель. Не может быть нулём.
    content.vb: Public Sub New(num As BigInteger, den As BigInteger)
  overload: Combinatorics.BigRational.#ctor*
  exceptions:
