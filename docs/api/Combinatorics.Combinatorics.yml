  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: >-
    Вычисляет число Деланнуа <code>D(m, n)</code> — число путей на решётке

    из (0,0) в (m,n) с шагами (1,0), (0,1), (1,1).
  remarks: >-
    <p>

    Автоматически выбирает алгоритм в зависимости от размера задачи:

    </p>

    <ul><li>
        При <code>m · n ≤ 2500</code> — закрытая формула <xref href="Combinatorics.Combinatorics.DelannoyClosed(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> (O(min(m,n)²)).
      </li><li>
        При <code>m · n &gt; 2500</code> — рекуррентность <xref href="Combinatorics.Combinatorics.DelannoyByRecurrence(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> (O(m·n), без вызовов <xref href="Combinatorics.Combinatorics.Combinations(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>).
      </li></ul>
    <p>

    Порог 2500 (≈ 50×50) подобран эмпирически: при меньших размерах

    накладные расходы рекуррентности превышают выигрыш; при больших —

    рекуррентность заметно быстрее.

    </p>

    <p>

    Обладает симметрией: <code>D(m, n) = D(n, m)</code>.

    </p>

    <p>

    Рекуррентность: <code>D(m,n) = D(m−1,n) + D(m,n−1) + D(m−1,n−1)</code>, D(0,n) = D(m,0) = 1.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var d1 = Delannoy(3, 3);       // 63

    var d2 = Delannoy(10, 10);     // 8097453

    var d3 = Delannoy(100, 100);   // вычисляется через рекуррентность — быстро</code></pre>
  syntax:
    content: public static BigInteger Delannoy(int m, int n)
    parameters:
    - id: m
      type: System.Int32
      description: Горизонтальная координата, m ≥ 0.
    - id: n
      type: System.Int32
      description: Вертикальная координата, n ≥ 0.
    return:
      type: System.Numerics.BigInteger
      description: Значение <code>D(m, n)</code>.
    content.vb: Public Shared Function Delannoy(m As Integer, n As Integer) As BigInteger
  overload: Combinatorics.Combinatorics.Delannoy*
  exceptions:
