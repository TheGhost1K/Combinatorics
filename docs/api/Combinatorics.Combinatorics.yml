  namespace: Combinatorics
  summary: 'n-е число Каталана: <code>C_n = C(2n, n) / (n+1)</code>.'
  remarks: >-
    <p>

    Считает: правильные скобочные последовательности, бинарные деревья,

    пути Дика, триангуляции выпуклого (n+2)-угольника.

    </p>

    <p>Асимптотика: <code>C_n ~ 4^n / (n^(3/2)·√π)</code> — см. <xref href="Combinatorics.Combinatorics.CatalanApprox(System.Int32)" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Рекуррентность: <code>C_{n+1} = Σ_{i=0}^{n} C_i · C_{n-i}</code>.</p>
  example:
  - >-
    <pre><code class="lang-csharp">var c10 = Catalan(10);   // 16796

    var c15 = Catalan(15);   // 9694845</code></pre>
  syntax:
    content: public static BigInteger Catalan(int n)
    parameters:
    - id: n
      type: System.Int32
      description: Неотрицательное целое.
    return:
