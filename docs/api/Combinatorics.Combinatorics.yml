    <p>Подъём — позиция i, где <code>π_i &lt; π_{i+1}</code>.</p>

    <p>Формула: <code>A(n, k) = Σ_{j=0}^{k+1} (−1)^j · C(n+1, j) · (k+1−j)^n</code>.</p>

    <p>Симметрия: <code>A(n, k) = A(n, n−1−k)</code>.</p>

    <p>Сумма по k даёт <code>n!</code>.</p>
  example:
