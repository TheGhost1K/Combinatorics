  remarks: >-
    <p>

    Определяются через производящую функцию: <code>x / (e^x − 1) = Σ B_n · x^n / n!</code>.

    </p>

    <p>

    Вычисляются по рекуррентности <code>Σ_{k=0}^{n} C(n+1, k) · B_k = 0</code> при n ≥ 1,

    <code>B_0 = 1</code>.

    </p>

    <p>

    Все <code>B_{2k+1} = 0</code> при k ≥ 1. Знаки чередуются: B_2 = 1/6, B_4 = −1/30, B_6 = 1/42, …

    </p>

    <p>

    Применяются в формуле Фаульхабера (суммы степеней) и в выражении дзета-функции

    Римана при чётных аргументах.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var b0 = Bernoulli(0); // 1

    var b1 = Bernoulli(1); // -1/2

    var b6 = Bernoulli(6); // 1/42</code></pre>
  syntax:
    content: public static BigRational Bernoulli(int n)
    parameters:
    - id: n
      type: System.Int32
      description: Неотрицательное целое.
    return:
      type: Combinatorics.BigRational
      description: Число Бернулли как <xref href="Combinatorics.BigRational" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Function Bernoulli(n As Integer) As BigRational
