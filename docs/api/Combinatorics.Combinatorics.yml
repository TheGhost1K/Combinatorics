  namespace: Combinatorics
  summary: >-
    Число Стирлинга второго рода: число разбиений множества из n элементов

    ровно на k непустых подмножеств.
  remarks: >-
    <p>Рекуррентность: <code>S(n, k) = S(n−1, k−1) + k·S(n−1, k)</code>.</p>

    <p>Сумма по k даёт число Белла: <code>B_n = Σ_k S(n, k)</code>.</p>

    <p>Сложность O(n·k), память O(k).</p>
  example:
  - <pre><code class="lang-csharp">var s = StirlingSecondKind(5, 2); // 15</code></pre>
  syntax:
