    parameters:
    - id: items
      type: System.Collections.Generic.IReadOnlyList{{T}}
      description: Исходная коллекция. Не изменяется.
    typeParameters:
    - id: T
      description: Тип элементов.
    return:
      type: System.Collections.Generic.IEnumerable{{T}[]}
      description: Ленивая последовательность массивов — перестановок элементов.
    content.vb: Public Shared Function Permutations(Of T)(items As IReadOnlyList(Of T)) As IEnumerable(Of T())
