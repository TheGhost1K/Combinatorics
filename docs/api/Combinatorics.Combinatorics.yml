  namespace: Combinatorics
  summary: Перебирает все перестановки коллекции (Heap's algorithm).
  remarks: >-
    <p>

    Возвращает <code>n!</code> перестановок в произвольном (не лексикографическом) порядке.

    Каждая перестановка — новый массив. Исходная коллекция не модифицируется.

    </p>

    <p>Сложность O(n!) по времени, O(n) по памяти.</p>
  example:
  - >-
    <pre><code class="lang-csharp">foreach (var p in Permutations(new[] { 1, 2, 3 }))
        Console.WriteLine(string.Join(", ", p));
    // 1, 2, 3

    // 2, 1, 3

    // 3, 1, 2

    // 1, 3, 2

    // 2, 3, 1

    // 3, 2, 1</code></pre>
  syntax:
