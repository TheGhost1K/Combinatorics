  namespace: Combinatorics
  summary: 'Число сочетаний из n по k: <code>C(n, k) = n! / (k! · (n−k)!)</code>.'
  remarks: >-
    <p>

    Используется симметрия <code>C(n, k) = C(n, n−k)</code> и поочерёдное умножение/деление,

    чтобы промежуточные значения оставались малыми. Точное деление гарантировано

    на каждом шаге (произведение i последовательных целых делится на i!).

    </p>

    <p>Сложность O(min(k, n−k)).</p>
  example:
  - >-
    <pre><code class="lang-csharp">var hands = Combinations(52, 5);   // 2598960 — покерные руки

    var small = Combinations(5, 2);    // 10</code></pre>
  syntax:
    content: public static BigInteger Combinations(int n, int k)
    parameters:
