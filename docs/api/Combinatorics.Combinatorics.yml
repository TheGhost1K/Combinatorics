  namespace: Combinatorics
  summary: 'Обобщённое число Моцкина <code>M_n^(m)</code>: пути с шагами ↑, ↓ и m цветами →.'
  remarks: >-
    <p>Рекуррентность: <code>M(0) = 1, M(n+1) = m·M(n) + Σ_{i=0}^{n-1} M(i)·M(n−1−i)</code>.</p>

    <p>Закрытая формула: <code>M_n^(m) = Σ_{k=0}^{⌊n/2⌋} C(n, 2k) · C_k · m^{n−2k}</code> —

    см. <xref href="Combinatorics.Combinatorics.MotzkinGeneralizedBySum(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.</p>

    <p>При m = 1 — обычные числа Моцкина, при m = 2 — <code>C_{n+1}</code>.</p>
  example:
  - <pre><code class="lang-csharp">var m3 = MotzkinGeneralized(5, 3); // 543</code></pre>
  syntax:
    content: public static BigInteger MotzkinGeneralized(int n, int m)
    parameters:
    - id: n
      type: System.Int32
      description: Длина пути, n ≥ 0.
    - id: m
      type: System.Int32
      description: Число цветов горизонтального шага, m ≥ 0.
    return:
      type: System.Numerics.BigInteger
      description: Значение M_n^(m).
    content.vb: Public Shared Function MotzkinGeneralized(n As Integer, m As Integer) As BigInteger
