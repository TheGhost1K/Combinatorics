  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: Вычисляет факториал <code>n!</code> через divide &amp; conquer.
  remarks: >-
    <p>

    В отличие от линейного цикла, использует рекурсивное разбиение диапазона

    пополам, что позволяет BCL применять быстрые алгоритмы умножения

    (Карацубы, Toom-Cook, Шёнхаге–Штрассена) на сопоставимо больших числах.

    </p>

    <p>

    Для n &lt; 100 разница с линейным циклом незначительна; для n &gt; 1000

    ускорение составляет 5–10 раз.

    </p>

    <p>

    Сложность: O(M(n log n) · log n), где M — сложность умножения двух n-битных чисел.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var f20  = Factorial(20);    // 2432902008176640000

    var f100 = Factorial(100);   // 9.33e157

    var f10k = Factorial(10000); // вычисляется за десятки миллисекунд</code></pre>
  syntax:
    content: public static BigInteger Factorial(int n)
    parameters:
    - id: n
      type: System.Int32
      description: Неотрицательное целое число.
    return:
      type: System.Numerics.BigInteger
      description: Произведение всех целых от 1 до n; 0! = 1.
    content.vb: Public Shared Function Factorial(n As Integer) As BigInteger
  overload: Combinatorics.Combinatorics.Factorial*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: Если <code class="paramref">n</code> &lt; 0.
  seealso:
  - linkType: HRef
    linkId: https://oeis.org/A000142
    altText: https://oeis.org/A000142
