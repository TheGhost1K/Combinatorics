  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: n-е число Дженокки G_n.
  remarks: >-
    <p>

    Определяются через производящую функцию: <code>2x / (e^x + 1) = Σ G_n · x^n / n!</code>.

    </p>

    <p>

    Связь с числами Бернулли: <code>G_n = 2(1 − 2^n) · B_n</code>.

    </p>

    <p>

    Свойства:


    <ul><li><code>G_0 = 0</code>, <code>G_1 = 1</code>.</li><li>Все <code>G_{2k+1} = 0</code> для k ≥ 1.</li><li>Знаки чередуются: <code>G_2 = −1</code>, <code>G_4 = 1</code>, <code>G_6 = −3</code>, <code>G_8 = 17</code>.</li></ul>

    </p>

    <p>

    Комбинаторный смысл: <code>|G_{2n}|</code> — число чередующихся перестановок

    с чётным числом элементов в специальном классе.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">Genocchi(0);   // 0

    Genocchi(2);   // -1

    Genocchi(4);   // 1

    Genocchi(6);   // -3

    Genocchi(8);   // 17</code></pre>
  syntax:
    content: public static BigInteger Genocchi(int n)
    parameters:
    - id: n
      type: System.Int32
      description: Неотрицательное целое.
    return:
      type: System.Numerics.BigInteger
      description: Значение G_n (знак может быть отрицательным).
    content.vb: Public Shared Function Genocchi(n As Integer) As BigInteger
