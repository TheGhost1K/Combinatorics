  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: 'Формула включений-исключений: мощность объединения множеств.'
  remarks: >-
    <p>

    Формула: <code>|∪Aᵢ| = Σ|Aᵢ| − Σ|Aᵢ ∩ Aⱼ| + Σ|Aᵢ ∩ Aⱼ ∩ A_k| − …</code>.

    </p>

    <p>

    Общая форма: <code>|∪Aᵢ| = Σ_{∅≠S} (−1)^{|S|+1} · |∩_{i∈S} Aᵢ|</code>.

    </p>

    <p>

    Сложность O(2ⁿ) по числу подмножеств. Для больших n применяются

    другие методы (DP по маскам при n ≤ 20).

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">// |A ∪ B ∪ C| = 10 + 15 + 20 − 5 − 4 − 3 + 1 = 34

    var sizes = new[] { 10, 15, 20 };

    var union = InclusionExclusion(sizes, idx =&gt; idx.Length switch

    {
        1 =&gt; sizes[idx[0]],
        2 =&gt; idx switch { [0,1] =&gt; 5, [0,2] =&gt; 4, [1,2] =&gt; 3, _ =&gt; 0 },
        3 =&gt; 1,
        _ =&gt; 0
    });</code></pre>
  syntax:
    content: public static BigInteger InclusionExclusion(int[] setSizes, Func<int[], BigInteger> intersectionSizes)
    parameters:
    - id: setSizes
      type: System.Int32[]
      description: Размеры множеств (для одноэлементных пересечений).
    - id: intersectionSizes
      type: System.Func{System.Int32[],System.Numerics.BigInteger}
      description: >-
        Функция, возвращающая размер пересечения заданного подмножества множеств

        (принимает массив индексов).
    return:
      type: System.Numerics.BigInteger
      description: <code>|A₁ ∪ A₂ ∪ … ∪ A_n|</code>.
    content.vb: Public Shared Function InclusionExclusion(setSizes As Integer(), intersectionSizes As Func(Of Integer(), BigInteger)) As BigInteger
  overload: Combinatorics.Combinatorics.InclusionExclusion*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Если аргумент равен <code>null</code>.
