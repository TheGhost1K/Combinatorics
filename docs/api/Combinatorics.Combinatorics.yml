  remarks: >-
    <p>

    Возвращает <code>C(n, k)</code> сочетаний. Каждое — возрастающий массив длины k.

    Имя <code>EnumerateCombinationIndices</code> выбрано, чтобы не конфликтовать с числовым

    <xref href="Combinatorics.Combinatorics.Combinations(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>Сложность O(C(n, k) · k) по времени, O(k) по памяти.</p>
  example:
  - >-
    <pre><code class="lang-csharp">foreach (var idx in EnumerateCombinationIndices(4, 2))
        Console.WriteLine(string.Join(",", idx));
    // 0,1

    // 0,2

    // 0,3

    // 1,2

    // 1,3

    // 2,3</code></pre>
