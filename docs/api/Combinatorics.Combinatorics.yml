  source:
    remote:
      path: src/Extended.cs
      branch: master
      repo: https://github.com/TheGhost1K/Combinatorics.git
    id: DelannoyFast
    path: ../src/Extended.cs
    startLine: 38
  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: Число Деланнуа D(m, n) через альтернативную формулу, эффективную при больших m, n.
  remarks: >-
    <p>

    Использует симметрию <code>D(m, n) = D(n, m)</code> и формулу

    <code>D(m, n) = Σ_{k=0}^{m} C(m, k) · C(n+k, m)</code>, где m = min(m, n).

    </p>

    <p>

    Для малых значений (m·n ≤ 2500) делегирует обычному <xref href="Combinatorics.Combinatorics.Delannoy(System.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>,

    который считает через <code>Σ C(m,k)·C(n,k)·2^k</code>.

    </p>

    <p>

    Обе формулы эквивалентны, но альтернативная короче при большом разбросе m и n,

    так как суммирование идёт по меньшему из них.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">DelannoyFast(3, 3);       // 63   — идёт через Delannoy (мало)

    DelannoyFast(100, 100);   // быстро, несмотря на большое значение

    DelannoyFast(500, 500);   // всё ещё быстро</code></pre>
  syntax:
    content: public static BigInteger DelannoyFast(int m, int n)
    parameters:
    - id: m
      type: System.Int32
      description: Горизонтальная координата, m ≥ 0.
    - id: n
      type: System.Int32
      description: Вертикальная координата, n ≥ 0.
    return:
      type: System.Numerics.BigInteger
      description: Значение D(m, n).
    content.vb: Public Shared Function DelannoyFast(m As Integer, n As Integer) As BigInteger
  overload: Combinatorics.Combinatorics.DelannoyFast*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Если m &lt; 0 или n &lt; 0.
  seealso:
  - linkId: Combinatorics.Combinatorics.Delannoy(System.Int32,System.Int32)
    commentId: M:Combinatorics.Combinatorics.Delannoy(System.Int32,System.Int32)
