      type: System.Int32
      description: Число элементов, n ≥ 0.
    - id: k
      type: System.Int32
      description: Число подмножеств, k ≥ 0.
    return:
      type: System.Numerics.BigInteger
      description: Значение <code>S(n, k)</code>.
    content.vb: Public Shared Function StirlingSecondKind(n As Integer, k As Integer) As BigInteger
