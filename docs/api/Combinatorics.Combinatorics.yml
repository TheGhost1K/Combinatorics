  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: Статический класс комбинаторных вычислений.
  remarks: >-
    <p>

    Содержит методы для факториалов, сочетаний, размещений, чисел Каталана,

    Стирлинга, Белла, Эйлера, Лаха, Нараяны, Моцкина, Шрёдера, Деланнуа,

    Фусса–Каталана, Фибоначчи, Люка, Пелля, Бернулли и их асимптотик.

    </p>

    <p>

    Класс разбит на несколько <code>partial</code>-файлов по логическим группам:


    <ul><li><code>Combinatorics.Basic.cs</code> — факториал, сочетания, размещения, Каталан, Паскаль.</li><li><code>Combinatorics.Stirling.cs</code> — числа Стирлинга 1-го и 2-го рода.</li><li><code>Combinatorics.BellEuler.cs</code> — числа Белла, Эйлера.</li><li><code>Combinatorics.Lah.cs</code> — числа Лаха и Fubini.</li><li><code>Combinatorics.Narayana.cs</code> — числа Нараяны.</li><li><code>Combinatorics.Motzkin.cs</code> — числа Моцкина.</li><li><code>Combinatorics.Bernoulli.cs</code> — числа Бернулли.</li><li><code>Combinatorics.Generators.cs</code> — генераторы перестановок и сочетаний.</li><li><code>Combinatorics.Extra.cs</code> — Деланнуа, Шрёдер, Фусс–Каталан.</li><li><code>Combinatorics.PellSchroeder.cs</code> — Пелль, Пелль–Люка, Шрёдер–Каталан.</li><li><code>Combinatorics.FibonacciMotzkin.cs</code> — Фибоначчи, Люка, обобщённый Моцкин.</li><li><code>Combinatorics.Binet.cs</code> — формулы Бине в точной арифметике.</li><li><code>Combinatorics.Asymptotics.cs</code> — базовые асимптотики.</li><li><code>Combinatorics.AsymptoticsExtended.cs</code> — расширенные асимптотики.</li><li><code>Combinatorics.Extended.cs</code> — оптимизированный Деланнуа, Дженокки, включения-исключения.</li></ul>

    </p>

    <p>

    Все методы возвращают <xref href="System.Numerics.BigInteger" data-throw-if-not-resolved="false"></xref> или <xref href="Combinatorics.BigRational" data-throw-if-not-resolved="false"></xref>,

    чтобы избежать переполнения на больших n.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">using static Combinatorics.Combinatorics;


    var f = Factorial(20);           // 2432902008176640000

    var c = Combinations(52, 5);     // 2598960

    var cat = Catalan(10);           // 16796</code></pre>
