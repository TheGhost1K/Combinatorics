  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: Утилиты для красивого форматирования и печати комбинаторных результатов.
  remarks: >-
    <p>Все методы возвращают строку или пишут в <xref href="System.Console" data-throw-if-not-resolved="false"></xref>. Класс не

    влияет на основные вычисления и не имеет состояния.</p>

    <p>Форматирование рассчитано на консольный вывод шириной до 120 символов,

    но большинство методов адаптируются под содержимое.</p>
  example:
  - >-
    <pre><code class="lang-csharp">using static Combinatorics.Combinatorics;

    using static Combinatorics.CombinatoricsFormatter;


    PrintResult("Catalan(10)", Catalan(10));

    // Catalan(10) = 16796


    Console.WriteLine(FormatSequence(CatalanSequence(10)));

    // 1, 1, 2, 5, 14, 42, 132, 429, 1430, 4862


    PrintApproxVsExact("F(50)", Fibonacci(50), FibonacciApprox(50));

    // F(50) = 12586269025  (≈ 1.2586e10, погрешность 0.000%)</code></pre>
  syntax:
    content: public static class CombinatoricsFormatter
