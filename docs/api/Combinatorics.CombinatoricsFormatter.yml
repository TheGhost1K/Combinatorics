  assemblies:
  - Combinatorics
  namespace: Combinatorics
  summary: 'Компактный формат для больших чисел: тысячи, миллионы, миллиарды.'
  remarks: >-
    Для чисел меньше 1000 — обычное представление.

    Для очень больших (&gt; 10¹²) — научная нотация.
  example:
  - >-
    <pre><code class="lang-csharp">FormatCompact(42);         // "42"

    FormatCompact(1500);       // "1.50K"

    FormatCompact(2_500_000);  // "2.50M"

    FormatCompact(Factorial(20)); // "2.43e18"</code></pre>
  syntax:
    content: public static string FormatCompact(BigInteger value)
    parameters:
    - id: value
      type: System.Numerics.BigInteger
      description: Целое число.
    return:
      type: System.String
      description: Строка вида <code>"1.23K"</code>, <code>"4.56M"</code>, <code>"7.89B"</code>.
    content.vb: Public Shared Function FormatCompact(value As BigInteger) As String
  overload: Combinatorics.CombinatoricsFormatter.FormatCompact*
